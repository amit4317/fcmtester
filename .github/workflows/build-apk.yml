name: Build Final FCM Tester APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      # Keep the same debug signing certificate for later builds whenever the
      # cache is available. If you installed an older APK signed by another
      # certificate, uninstall that older copy once before installing this one.
      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fcm-tester-stable-debug-keystore-v2

      - name: Create Firebase config and detect package name
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "::error::Missing Firebase config. Add repository secret GOOGLE_SERVICES_JSON containing the full google-services.json contents."
            exit 1
          fi

          python3 - <<'PY'
          import json, os
          path = "app/google-services.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          clients = data.get("client", [])
          if not clients:
              raise SystemExit("google-services.json has no Android client entries")

          package_name = None
          for client in clients:
              android_info = client.get("client_info", {}).get("android_client_info", {})
              candidate = android_info.get("package_name")
              if candidate:
                  package_name = candidate
                  break

          if not package_name:
              raise SystemExit("Could not find an Android package_name in google-services.json")

          print(f"Firebase Android package: {package_name}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FCM_PACKAGE_NAME={package_name}\n")
          PY

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleDebug

      - name: Create final APK file
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk FCMTester.apk
          sha256sum FCMTester.apk > FCMTester.apk.sha256
          ls -lh FCMTester.apk FCMTester.apk.sha256

      - name: Verify APK is valid and signed
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          "$APKSIGNER" verify --verbose --print-certs FCMTester.apk
          "$ZIPALIGN" -c -v 4 FCMTester.apk
          "$AAPT" dump badging FCMTester.apk | head -20

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCMTester-final-apk
          path: |
            FCMTester.apk
            FCMTester.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # GitHub Actions artifacts download as a ZIP. A GitHub Release asset is a
      # real .apk download, so this also publishes FCMTester.apk directly.
      - name: Publish direct APK download in GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="fcmtester-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="FCM Tester APK build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" \
            FCMTester.apk \
            FCMTester.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Installable FCM Tester APK. If Android reports the package is invalid while an older FCM Tester is already installed, uninstall the older copy once and install this APK again; the older APK may have been signed by a different debug certificate."

          RELEASE_URL="$(gh release view "$TAG" --json url -q .url)"
          {
            echo "## Final APK"
            echo
            echo "The APK was validated with apksigner and zipalign."
            echo
            echo "Release: $RELEASE_URL"
            echo
            echo "Download **FCMTester.apk** from the release Assets section."
          } >> "$GITHUB_STEP_SUMMARY"
