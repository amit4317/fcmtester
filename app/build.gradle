plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.fcmtester'
    compileSdk 36

    defaultConfig {
        // GitHub Actions sets this from the first Android client in google-services.json.
        // This means the Firebase package name does not have to be com.example.fcmtester.
        applicationId System.getenv('FCM_PACKAGE_NAME') ?: 'com.example.fcmtester'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
