name: Build FCM Tester Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      # Keeps the debug signing key stable across builds in this repository when
      # the cache is available. The first Pro APK may still have a different
      # signature from an older project build, so uninstall that older APK once.
      - name: Restore test debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: fcm-tester-pro-debug-keystore-v1

      - name: Create Firebase config and detect package name
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "::error::Missing Firebase config. Add a repository Actions secret named GOOGLE_SERVICES_JSON containing the full contents of google-services.json."
            exit 1
          fi

          python3 - <<'PY'
          import json, os
          path = "app/google-services.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          clients = data.get("client", [])
          if not clients:
              raise SystemExit("google-services.json has no client entries")
          android_info = clients[0].get("client_info", {}).get("android_client_info", {})
          package_name = android_info.get("package_name")
          if not package_name:
              raise SystemExit("Could not find client[0].client_info.android_client_info.package_name")
          print(f"Firebase Android package: {package_name}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FCM_PACKAGE_NAME={package_name}\n")
          PY

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FCMTester-Pro-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: FCMTester-Pro-debug-apk
          path: FCMTester-Pro-debug.apk
          retention-days: 30
