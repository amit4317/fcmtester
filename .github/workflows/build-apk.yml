name: Build Final FCM Tester APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # v3 used to request the removed Android SDK "tools" package by default.
      # v4 fixes that behavior. packages: '' prevents the action from installing
      # any optional SDK packages; we install only the exact ones needed below.
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;36.0.0' || true

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fcm-tester-stable-debug-keystore-v2

      - name: Create Firebase config and detect package name
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "::error::Missing Firebase config. Add repository secret GOOGLE_SERVICES_JSON containing the full google-services.json contents."
            exit 1
          fi

          python3 - <<'PY'
          import json, os
          path = "app/google-services.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          clients = data.get("client", [])
          if not clients:
              raise SystemExit("google-services.json has no Android client entries")

          package_name = None
          for client in clients:
              android_info = client.get("client_info", {}).get("android_client_info", {})
              candidate = android_info.get("package_name")
              if candidate:
                  package_name = candidate
                  break

          if not package_name:
              raise SystemExit("Could not find an Android package_name in google-services.json")

          print(f"Firebase Android package: {package_name}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"FCM_PACKAGE_NAME={package_name}\n")
          PY

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean :app:assembleDebug

      - name: Create final APK file
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk FCMTester.apk
          sha256sum FCMTester.apk > FCMTester.apk.sha256
          ls -lh FCMTester.apk FCMTester.apk.sha256

      - name: Verify APK is valid and signed
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"

          "$APKSIGNER" verify --verbose --print-certs FCMTester.apk
          "$ZIPALIGN" -c -v 4 FCMTester.apk
          "$AAPT" dump badging FCMTester.apk | head -20

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FCMTester-final-apk
          path: |
            FCMTester.apk
            FCMTester.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download in GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="fcmtester-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          TITLE="FCM Tester APK build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" \
            FCMTester.apk \
            FCMTester.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Installable FCM Tester APK. Download FCMTester.apk from the release Assets section. If an older build with the same package name was signed by a different key, uninstall that older copy once before installing this one."

          RELEASE_URL="$(gh release view "$TAG" --json url -q .url)"
          {
            echo "## Final APK"
            echo
            echo "APK validation passed with apksigner, zipalign, and aapt."
            echo
            echo "Release: $RELEASE_URL"
            echo
            echo "Download **FCMTester.apk** from the release Assets section."
          } >> "$GITHUB_STEP_SUMMARY"
